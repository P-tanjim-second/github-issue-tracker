<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Issues Tracker</title>
    <!-- dailyUI+tailwindcss CDN link -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- icon library CDN -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- stylesheet -->
    <link rel="stylesheet" href="style.css">

    <link rel="shortcut icon" href="./assets/github-favicon.png" type="image/x-icon">
</head>

<body class="font-['Geist'] bg-[#F8FAFC] min-h-dvh">

    <header>
        <nav class="w-full shadow-md p-5 md:px-20 flex justify-between items-center">
            <div class="flex justify-center items-center gap-1.5 md:gap-2.5  flex-col md:flex-row">
                <div class="object-contain w-16 md:w-10"><img src="./assets/github-logo.png"></div>
                <h3 class=" text-base md:text-xl font-semibold text-center md:text-left">GitHub Issues Tracker</h3>
            </div>
            <div class="flex gap-2 md:gap-5 flex-col md:flex-row">
                <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                            stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input type="search" required placeholder="Search Issues..." />
                </label>

                <button class="btn btn-primary">+New Issues</button>
            </div>
        </nav>
    </header>

    <main class="w-11/12 mx-auto mt-14 space-y-4">
        <section class="tab flex justify-start items-center gap-2 bg-white p-5 rounded-lg shadow-sm">
            <button id="all" class="btn btn-primary min-w-32">All</button>
            <button id="open" class="btn border-[#E4E4E7] text-[#64748B] min-w-32">Open</button>
            <button id="closed" class="btn border-[#E4E4E7] text-[#64748B] min-w-32">Closed</button>
        </section>

        <section class="rounded-xl shadow-sm flex flex-col justify-center items-center">
            <div class="bg-white w-full border-b border-b-[#e5e5e5] flex justify-between items-center p-6 rounded-t-xl">
                <div class="flex gap-1.5 items-center">
                    <div class="bg-[#ECE4FF] flex justify-center items-center p-2 rounded-full w-fit h-fit"><img
                            src="./assets/Aperture.png"></div>
                    <div>
                        <h5 class="font-bold"><span id="total">0</span> Issues</h5>
                        <p class="text-[14px] text-[#64748B]">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="flex justify-center items-center gap-1.5">
                        <div aria-label="status" class="status status-accent"></div>
                        <p>Open</p>
                    </div>
                    <div class="flex justify-center items-center gap-1.5">
                        <div aria-label="status" class="status status-primary"></div>
                        <p>Closed </p>
                    </div>
                </div>
            </div>
            <div id="card-container"
                class="bg-[#FBFBFB] p-6 rounded-b-xl grid gap-5 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
            </div>
            <span class="loading loading-bars loading-xl hidden"></span>
        </section>


        <dialog id="card_modal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box">
                <div class="modal-data  space-y-3">
                    <h3 class="text-lg font-bold">Fix broken image uploads</h3>
                    <div class="flex w-full justify-between items-center">
                        <button
                            class="btn btn-active btn-success max-h-6 sm:max-h-full max-w-16 sm:max-w-full text-[12px] sm:text-base capitalize rounded-full text-white font-normal">Opened</button>
                        <span class="h-1 w-1 rounded-full bg-[#515e71]"></span>
                        <p class="text-[#64748B] text-[14px]">Opened by Fahim Ahmed</p>
                        <span class="h-1 w-1 rounded-full bg-[#515e71]"></span>
                        <p class="text-[#64748B] text-[14px]">22/02/2026</p>
                    </div>
                    <div class="flex gap-1 my-6">
                        <button
                            class="btn btn-soft border border-secondary/30 btn-secondary px-2 py-0 rounded-full max-h-7 uppercase"><i
                                class="ri-bug-line"></i> Bug</button>
                        <button
                            class="btn btn-soft border border-warning/30 btn-warning  px-2 py-0 rounded-full max-h-7 uppercase"><i
                                class="ri-lifebuoy-line"></i> help wanted</button>
                    </div>
                    <p class="text-[#64748B] text-[14px]">The navigation menu doesn't collapse properly on mobile
                        devices.
                        Need to fix the responsive behavior.</p>
                    <div class="flex p-2.5 justify-between bg-[#F8FAFC] rounded-xl">
                        <div class="flex-1 flex flex-col justify-between">
                            <p class="text-[#64748B]">Assignee:</p>
                            <p class="font-semibold">Fahim Ahmed</p>
                        </div>
                        <div class="flex-1">
                            <p class="text-[#64748B]">Priority:</p>
                            <p class="uppercase px-3.5 py-0.5 bg-[#EF4444] text-[13px] text-white rounded-full w-fit">
                                high</p>
                        </div>
                    </div>
                </div>
                
                <div class="modal-action">
                    <form method="dialog">
                        <button class="btn btn-primary">Close</button>
                    </form>
                </div>
            </div>
        </dialog>
    </main>


    <script src="./script/script.js"></script>
</body>

</html>
